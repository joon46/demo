<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>REST API 게시판 (보안 실습용)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .form-container { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; width: 400px; }
        .form-container input, .form-container textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>📌 게시글 작성</h2>
    <div class="form-container">
        <input type="text" id="title" placeholder="제목">
        <input type="text" id="writer" placeholder="작성자">
        <input type="password" id="password" placeholder="비밀번호">
        <textarea id="content" placeholder="내용" rows="4"></textarea>
        <button onclick="createBoard()">글 등록</button>
    </div>

    <h2>📋 게시글 목록</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>작성자</th>
                <th>내용</th>
                <th>관리</th> 
            </tr>
        </thead>
        <tbody id="boardList">
            <!-- JavaScript로 목록 삽입 -->
        </tbody>
    </table>

    <script>
        const API_URL = '/api/boards';

        // 1. 게시글 목록 불러오기 (GET)
        async function fetchBoards() {
            try {
                const response = await fetch(API_URL);
                const boards = await response.json();
                
                const tbody = document.getElementById('boardList');
                tbody.innerHTML = '';

                boards.forEach(board => {
                    const tr = document.createElement('tr');

                    const tdId = document.createElement('td');
                    tdId.textContent = board.id;

                    const tdTitle = document.createElement('td');
                    tdTitle.textContent = board.title;

                    const tdWriter = document.createElement('td');
                    tdWriter.textContent = board.writer;

                    const tdContent = document.createElement('td');
                    tdContent.textContent = board.content; // 악성 태그가 들어와도 단순 텍스트로 안전하게 출력됨

                    const tdAction = document.createElement('td');
                    const delBtn = document.createElement('button');
                    delBtn.textContent = '삭제';
                    delBtn.onclick = () => deleteBoard(board.id);
                    tdAction.appendChild(delBtn);

                    tr.appendChild(tdId);
                    tr.appendChild(tdTitle);
                    tr.appendChild(tdWriter);
                    tr.appendChild(tdContent);
                    tr.appendChild(tdAction);

                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('목록 불러오기 실패:', error);
            }
        }

        // 2. 게시글 작성하기 (POST)
        async function createBoard() {
            const title = document.getElementById('title').value;
            const writer = document.getElementById('writer').value;
            const password = document.getElementById('password').value;
            const content = document.getElementById('content').value;

            const boardData = { title, writer, password, content };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(boardData)
                });

                if (response.ok) {
                    alert('등록되었습니다!');
                    document.getElementById('title').value = '';
                    document.getElementById('writer').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('content').value = '';
                    fetchBoards(); // 목록 갱신
                }
            } catch (error) {
                console.error('글 등록 실패:', error);
            }
        }

        // 👇 3. 게시글 삭제하기 (DELETE) 함수 새로 추가
        async function deleteBoard(id) {
            const password = prompt('게시글 비밀번호를 입력하세요:');
            if (!password) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const message = await response.text();
                alert(message);

                if (response.ok) {
                    fetchBoards();
                }
            } catch (error) {
                console.error('삭제 요청 실패:', error);
            }
}

        // 페이지 로드시 목록 초기화
        fetchBoards();
    </script>
</body>
</html>
